# EXPERIMENTAL: MiMo-V2.6-Flash-MOPD, AesSedai BPW2.5 at b6e95d58
# (90.09 GiB), on the base XiaomiMiMo/MiMo-V2.6-Flash-MOPD at 5220c3f5.
# Pinned to upstream llama.cpp b12206 @ cf34d311332e (BUILDINFO.json on the
# Z13 records binary sha256). This is a separate ModelHost, not Gufo.
#
# This upstream HIP host is the baseline; the operator's primary MiMo
# engine is an optimized llama.cpp Vulkan + DFlash build (adapter to
# come).
#
# It is committed disabled because it shares the exclusive
# z13-large-gpu group with production Qwen and GLM. Enabling it needs an
# operator-approved window.
#
# expectedMemoryGiB 98 is the upper bound of the derived ~95-98 GiB
# estimate in 02. It is not measured.
#
# Tool calls are MiMo XML (<tool_call><function=..><parameter=..>, no
# newlines), parsed by llama.cpp's generic path from
# chat_template.jinja. Reasoning is <think> and on by default (mimo.md
# §2). Issue #29931 (long-context tool-call corruption on Vulkan+RPC)
# is unresolved.
apiVersion: llamactl/v1
kind: ModelHost
metadata:
  name: llamacpp-mimo26-flash-bpw25
  labels:
    family: mimo26
    llamactl.io/qualification: experimental
    llamactl.io/residency-group: z13-large-gpu
spec:
  engine: llamacpp
  node: z13
  enabled: false
  binary: /home/alex/strix-halo-bench/runtimes/llama.cpp-cf34d311332e/bin/llama-server
  resources:
    expectedMemoryGiB: 98
  # Port 8083 avoids 8080 (production Gufo), 8081 (gufo-glm53-exp)
  # and 8082 (gufo-qwen38-v026-exp) on z13.
  endpoint:
    host: 127.0.0.1
    port: 8083
  hostedModels:
    - rel: MiMo-V2.6-Flash-MOPD-GGUF-AesSedai/b6e95d58/BPW2.5/MiMo-V2.6-Flash-MOPD-BPW2.5-00001-of-00003.gguf
  extraArgs:
    # --served-model-name equals the GGUF basename, because a ModelHost
    # routes by rel and basename.
    - --served-model-name
    - MiMo-V2.6-Flash-MOPD-BPW2.5-00001-of-00003.gguf
    # -c 65536 sits inside the 64K-128K Z13 band of a 1M-context model.
    - -c
    - "65536"
    # --jinja makes the shipped chat template drive tool calls and
    # reasoning.
    - --jinja
    # --spec-type draft-dflash + -md drafter path (b12206 uses spec-type).
    # The drafter file is relative so llamacpp resolves it against the models
    # dir (#544).
    - --spec-type
    - draft-dflash
    - -md
    - MiMo-V2.6-Flash-MOPD-GGUF-ggml-org/c9d86979/dflash/dflash-MiMo-V2.6-Flash-MOPD-Q8_0.gguf
  restartPolicy: Never
