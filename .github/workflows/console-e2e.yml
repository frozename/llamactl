name: console-e2e

# REQUIRED: the Bun-served web console is the only UI runtime since
# #410 P7-A, so this job gates every PR and push to main. It must not
# use continue-on-error — failures block merges.

on:
  pull_request:
    branches: main
  push:
    branches: main
  workflow_dispatch:

jobs:
  console-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the console web bundle
        run: bun run --cwd packages/app build:web

      - name: Install Playwright chromium
        working-directory: packages/app
        run: npx playwright install --with-deps chromium

      - name: Run console e2e
        working-directory: packages/app
        run: npx playwright test

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            packages/app/playwright-report
            packages/app/test-results
