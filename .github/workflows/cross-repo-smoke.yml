name: cross-repo-smoke

# Cross-repo schema + integration smoke. Checks out llamactl and its
# three runtime siblings (nova, sirius-gateway, embersynth) side by
# side and runs scripts/smoke-cross-repo.sh. Catches the class of bug
# where a nova contracts schema field gets renamed and only one of the
# three consumers notices — the seam test in each repo fails loudly
# instead of silent drift making it to operator-visible behavior.
#
# llamactl resolves @novaproto/* from npm (exact pins) and never reads
# ../nova. sirius-gateway and embersynth still consume nova through
# `file:../nova/packages/*` under the old @nova/* names, so the nova
# checkout stays, pinned for them.

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch:

concurrency:
  group: cross-repo-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout llamactl
        uses: actions/checkout@v4
        with:
          path: llamactl

      - name: Checkout nova
        uses: actions/checkout@v4
        with:
          repository: frozename/nova
          path: nova
          # Pinned to the nova commit that sirius-gateway's and embersynth's file: @nova/*
          # dependencies are built against; nova main ships the renamed @novaproto/* packages
          # with dist entry points. Unpin after both move to the published packages.
          ref: e1a65bd77710afb4b3cf67909bd1984bf80837b1

      - name: Checkout sirius-gateway
        uses: actions/checkout@v4
        with:
          repository: frozename/sirius-gateway
          path: sirius-gateway
          ref: main

      - name: Checkout embersynth
        uses: actions/checkout@v4
        with:
          repository: frozename/embersynth
          path: embersynth
          ref: main

      # The sibling tiers stay on the Bun their repositories pin. llamactl's tier runs on
      # llamactl's pin (below): Bun 1.3.14's Bun.serve ignores response-body backpressure on
      # Linux, which the worker-RPC bounded-streaming tests depend on, and embersynth's
      # streaming-terminal tests do not yet pass on Bun 1.4 (seen on Linux).
      - name: Setup Bun for the sibling tiers
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # `file:` deps in sirius-gateway and embersynth point at
      # ../nova/packages/*. GitHub's actions/checkout parks each repo
      # at ${{ github.workspace }}/<name>, which IS sibling layout —
      # the file: URLs resolve correctly without symlinks.
      - name: Install nova
        working-directory: nova
        run: bun install --frozen-lockfile || bun install

      - name: Install sirius-gateway
        working-directory: sirius-gateway
        run: bun install --frozen-lockfile || bun install

      - name: Install embersynth
        working-directory: embersynth
        run: bun install --frozen-lockfile || bun install

      - name: Install llamactl
        working-directory: llamactl
        run: bun install --frozen-lockfile || bun install

      - name: Run cross-repo smoke
        working-directory: llamactl
        env:
          NOVA_DIR: ${{ github.workspace }}/nova
          SIRIUS_DIR: ${{ github.workspace }}/sirius-gateway
          EMBERSYNTH_DIR: ${{ github.workspace }}/embersynth
          # GitHub's hosted macOS runners block multicast, so the
          # mDNS discovery tests time out there. The test suite has
          # a dedicated skip env var for exactly this case.
          LLAMACTL_SKIP_MDNS_TESTS: "1"
          SKIP_LLAMACTL: "1"
        run: bash scripts/smoke-cross-repo.sh

      - name: Setup Bun for the llamactl tier
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # bun reads bunfig.toml from the directory it runs in, so a root-level
      # `bun test` skips the per-package storage-sandbox preload (packages/cli
      # and packages/remote bunfig.toml). Run each package from its own
      # directory, as check.yml does (#334).
      - name: Run llamactl tier (packages/core)
        working-directory: llamactl
        env:
          LLAMACTL_SKIP_MDNS_TESTS: "1"
        run: bun run --cwd packages/core test

      - name: Run llamactl tier (packages/cli)
        working-directory: llamactl
        env:
          LLAMACTL_SKIP_MDNS_TESTS: "1"
        run: bun run --cwd packages/cli test

      - name: Run llamactl tier (packages/app)
        working-directory: llamactl/packages/app
        env:
          LLAMACTL_SKIP_MDNS_TESTS: "1"
        run: bun test

      - name: Run llamactl tier (packages/remote)
        working-directory: llamactl
        env:
          LLAMACTL_SKIP_MDNS_TESTS: "1"
        run: bun run --cwd packages/remote test

      - name: Run llamactl tier (packages/eval)
        working-directory: llamactl
        env:
          LLAMACTL_SKIP_MDNS_TESTS: "1"
        run: bun run --cwd packages/eval test

      - name: Run llamactl tier (packages/agents)
        working-directory: llamactl
        env:
          LLAMACTL_SKIP_MDNS_TESTS: "1"
        run: bun run --cwd packages/agents test

      - name: Run llamactl tier (packages/fleet-supervisor)
        working-directory: llamactl
        env:
          LLAMACTL_SKIP_MDNS_TESTS: "1"
        run: bun run --cwd packages/fleet-supervisor test

      - name: Run llamactl tier (packages/mcp)
        working-directory: llamactl
        env:
          LLAMACTL_SKIP_MDNS_TESTS: "1"
        run: bun run --cwd packages/mcp test

      # The tests outside those packages, which the old root-level run also
      # covered. The ./ prefix makes bun treat each argument as a path, not a
      # substring filter (a bare `tools` also matches packages/mcp/test/fleet-tools.test.ts).
      - name: Run llamactl tier (policy, scripts, tests, tools)
        working-directory: llamactl
        env:
          LLAMACTL_SKIP_MDNS_TESTS: "1"
        run: bun test ./packages/policy ./scripts ./tests ./tools
