name: check

# Mainline PR gate for typecheck, package tests, formatting, and the
# advisory lint baseline burn-down. Mirrors the sibling checkout layout
# used by the other CI workflows because this repo depends on
# `file:../../../nova/packages/*`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout llamactl
        uses: actions/checkout@v4
        with:
          path: llamactl

      - name: Checkout nova
        uses: actions/checkout@v4
        with:
          repository: frozename/nova
          # Pinned to the nova commit that llamactl's file: @nova/* dependencies are built
          # against; unpin after llamactl moves to the published @novaproto/* packages.
          ref: e1a65bd77710afb4b3cf67909bd1984bf80837b1
          path: nova

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install nova
        working-directory: nova
        run: bun install --frozen-lockfile || bun install

      - name: Install llamactl
        working-directory: llamactl
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: llamactl
        run: bun run typecheck

      - name: Test packages/core
        working-directory: llamactl
        run: bun run --cwd packages/core test

      - name: Test packages/cli
        working-directory: llamactl
        run: bun run --cwd packages/cli test

      - name: Test packages/app
        working-directory: llamactl/packages/app
        run: bun test

      - name: Test packages/remote
        working-directory: llamactl
        run: bun run --cwd packages/remote test

      - name: Test packages/eval
        working-directory: llamactl
        run: bun run --cwd packages/eval test

      - name: Test packages/agents
        working-directory: llamactl
        run: bun run --cwd packages/agents test

      - name: Test packages/fleet-supervisor
        working-directory: llamactl
        run: bun run --cwd packages/fleet-supervisor test

      - name: Test packages/mcp
        working-directory: llamactl
        run: bun run --cwd packages/mcp test

      - name: Test exec-primitives test consumer
        working-directory: llamactl/test/consumers/exec-primitives
        run: bun install --frozen-lockfile && bun run typecheck && bun run test

      - name: Test train syntax
        working-directory: llamactl/packages/train
        run: bash scripts/check-syntax.sh

      - name: Format check
        working-directory: llamactl
        run: bun run format:check

      - name: Lint
        working-directory: llamactl
        # Error tier reached zero on 2026-06-10 (baseline:
        # docs/quality/lint-baseline-2026-06-10.json — 0 errors /
        # 2439 warnings); errors now block. Warnings stay advisory
        # until the warn-tier burn-down.
        run: bun run lint
