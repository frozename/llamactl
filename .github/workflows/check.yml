name: check

# Mainline PR gate for typecheck, package tests, formatting, and the
# advisory lint baseline burn-down. llamactl resolves its @novaproto/*
# dependencies from npm (exact pins), so no nova checkout is needed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Production llamactl runs on Linux (Ubuntu 24.04); a Linux-only Bun.serve
    # backpressure defect passed this gate while it ran on macOS only (#178).
    # Nothing is skipped on Linux: the Linux-only packages/core test failures are
    # tracked in #177, and this leg merges only after #177 is fixed.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The macOS leg takes 13-15 min as of 2026-11-17 and was hitting a 15 min
    # limit (cancelled runs on main and on PRs), so it has headroom here.
    timeout-minutes: 25
    steps:
      - name: Checkout llamactl
        uses: actions/checkout@v4
        with:
          path: llamactl

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install llamactl
        working-directory: llamactl
        run: bun install --frozen-lockfile

      - name: Secret scan
        working-directory: llamactl
        run: bun run secrets:scan

      - name: Typecheck
        working-directory: llamactl
        run: bun run typecheck

      - name: Test packages/core
        working-directory: llamactl
        run: bun run --cwd packages/core test

      - name: Test packages/cli
        working-directory: llamactl
        run: bun run --cwd packages/cli test

      - name: Test packages/app
        working-directory: llamactl
        run: bun run --cwd packages/app test

      - name: Diagnose macOS oMLX cache fixture
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        timeout-minutes: 2
        working-directory: llamactl/packages/remote
        env:
          LLAMACTL_TEST_TRACE_OMLX_BOOT: "1"
        run: |
          command -v python3
          python3 --version
          bun test ./test/workload/modelhost-omlx-cache.test.ts

      - name: Test packages/remote
        working-directory: llamactl
        run: bun run --cwd packages/remote test

      - name: Test packages/eval
        working-directory: llamactl
        run: bun run --cwd packages/eval test

      - name: Test packages/agents
        working-directory: llamactl
        run: bun run --cwd packages/agents test

      - name: Test packages/fleet-supervisor
        working-directory: llamactl
        run: bun run --cwd packages/fleet-supervisor test

      - name: Test packages/mcp
        working-directory: llamactl
        run: bun run --cwd packages/mcp test

      - name: Test tools
        working-directory: llamactl
        run: bun test ./tools/penumbra-handoff-feed.test.ts

      - name: Test exec-primitives test consumer
        working-directory: llamactl/test/consumers/exec-primitives
        run: bun install --frozen-lockfile && bun run typecheck && bun run test

      - name: Test train syntax
        working-directory: llamactl/packages/train
        run: bash scripts/check-syntax.sh

      - name: Format check
        working-directory: llamactl
        run: bun run format:check

      - name: Lint
        working-directory: llamactl
        # Error tier reached zero on 2026-06-10 (baseline:
        # docs/quality/lint-baseline-2026-06-10.json — 0 errors /
        # 2439 warnings); errors now block. Warnings stay advisory
        # until the warn-tier burn-down.
        # eslint's default heap OOMs on the macos-latest runner
        # (Abort trap: 6, "heap out of memory"); give it room.
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run lint
